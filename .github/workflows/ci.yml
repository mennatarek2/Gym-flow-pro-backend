name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    env:
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GMS.slnx

      - name: Build
        run: dotnet build GMS.slnx --no-restore --nologo -v q

      - name: Test
        run: dotnet test GMS.Tests/GMS.Tests.csproj --no-build --nologo -v q

      - name: ReconCheck build
        run: dotnet build GMS.Tests/ReconCheck/ReconCheck.csproj --no-restore --nologo -v q

  frontend-i18n:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      - name: Localization CI gate
        run: npm run i18n:ci

      - name: Refresh inventory (informational)
        run: npm run i18n:inventory
